; Dev em Docker sobre bind mount do Windows (9p): cada stat de ficheiro e lento.
; Revalidar raramente (alteracoes de PHP aparecem em ate 30 s) e cachear tudo.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=30
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
