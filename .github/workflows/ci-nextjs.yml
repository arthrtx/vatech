# CI Next.js 16 (web/): lint, tipos, testes e build.
#
# O gate estático prova que COMPILA, não que FUNCIONA: o eslint não é opcional
# (`react/jsx-no-undef` é o único que apanha identificadores indefinidos).

name: CI Next.js

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Os tipos de `.next/types` não existem num checkout limpo.
      - name: Gerar tipos do Next
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
