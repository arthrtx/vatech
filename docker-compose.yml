# Servicos de desenvolvimento local (MySQL 8.4 + phpMyAdmin). Valores so para dev.
services:
  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root_local
      MYSQL_DATABASE: vatech
      MYSQL_USER: vatech
      MYSQL_PASSWORD: vatech_local
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
  phpmyadmin:
    image: phpmyadmin:5
    ports: ["8080:80"]
    environment: { PMA_HOST: mysql }
    depends_on: [mysql]
volumes:
  mysql-data:
